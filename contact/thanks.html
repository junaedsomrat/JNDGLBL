
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['"Lato"', 'sans-serif'] } } } }
    </script>
   <script src="https://junaedsomrat.github.io/JNDGLBL/contact/thanks-style.js"></script>
</head>
<body class="font-serif">
    <main class="min-h-screen w-full flex flex-col items-center justify-center p-6 text-center">
        <div class="fixed inset-0 pointer-events-none">
            <div class="absolute top-0 left-1/4 w-[1px] h-full bg-white/5"></div>
            <div class="absolute top-0 right-1/4 w-[1px] h-full bg-white/5"></div>
        </div>

        <div id="content" class="opacity-0 translate-y-4">
            <div class="w-20 h-20 border border-white/20 rounded-full flex items-center justify-center mx-auto mb-8">
                <i data-lucide="check" class="w-8 h-8 text-white"></i>
            </div>
            <h2 class="text-xs font-sans text-gray-500 uppercase tracking-[0.3em] mb-2">Transmission Successful</h2>
            <h1 class="text-7xl md:text-8xl italic shimmer-text mb-6">Archived.</h1>
            <p class="text-gray-400 text-xl max-w-md mx-auto">Your correspondence has been received. You will be redirected shortly.</p>
            
            <div class="mt-12 max-w-[200px] mx-auto">
                <div class="h-[1px] w-full bg-white/10 relative overflow-hidden">
                    <div id="progress" class="progress-bar"></div>
                </div>
                <p class="font-sans text-[10px] uppercase tracking-widest text-gray-600 mt-4">Returning in <span id="count">5</span>s</p>
            </div>
        </div>
    </main>
<script src="https://junaedsomrat.github.io/JNDGLBL/contact/thanks-script.js">thanks-script.js</script>
</body>
</html>
