<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Material Symbols for the backspace icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<script src="/web-projects/calculator/style.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- Calculator Container -->
    <div class="calculator-bg w-full max-w-[360px] rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[700px] max-h-[85vh] z-10">
        
        <!-- Display Area -->
        <div class="flex-1 flex flex-col justify-end p-6 pb-2 relative">
            <!-- History / Expression -->
            <div id="history" class="text-[#9aa0a6] text-xl text-right overflow-x-auto whitespace-nowrap mb-2 min-h-[1.75rem]"></div>
            
            <!-- Current Input / Result -->
            <div id="display" class="text-[#e8eaed] text-6xl text-right overflow-hidden whitespace-nowrap font-normal tracking-tight truncate">0</div>
        </div>

        <!-- Keypad Area -->
        <div class="p-4 grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button class="btn btn-action aspect-square rounded-full flex items-center justify-center text-xl font-medium" onclick="handleInput('AC')">AC</button>
            <button class="btn btn-action aspect-square rounded-full flex items-center justify-center text-xl font-medium" onclick="handleInput('(')">(</button>
            <button class="btn btn-action aspect-square rounded-full flex items-center justify-center text-xl font-medium" onclick="handleInput(')')">)</button>
            <button class="btn btn-op aspect-square rounded-full flex items-center justify-center font-medium" onclick="handleInput('÷')">÷</button>

            <!-- Row 2 -->
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('7')">7</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('8')">8</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('9')">9</button>
            <button class="btn btn-op aspect-square rounded-full flex items-center justify-center font-medium" onclick="handleInput('×')">×</button>

            <!-- Row 3 -->
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('4')">4</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('5')">5</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('6')">6</button>
            <button class="btn btn-op aspect-square rounded-full flex items-center justify-center font-medium" onclick="handleInput('-')">−</button>

            <!-- Row 4 -->
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('1')">1</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('2')">2</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('3')">3</button>
            <button class="btn btn-op aspect-square rounded-full flex items-center justify-center font-medium" onclick="handleInput('+')">+</button>

            <!-- Row 5 -->
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('0')">0</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('.')">.</button>
            <button class="btn btn-num aspect-square rounded-full flex items-center justify-center text-2xl" onclick="handleInput('DEL')">
                <span class="material-symbols-outlined">backspace</span>
            </button>
            <button class="btn btn-eq aspect-square rounded-full flex items-center justify-center font-medium shadow-md" onclick="handleInput('=')">=</button>
        </div>
    </div>

   <script src="/web-projects/calculator/script.js"></script>
</body>
</html>
