
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Textde - Ephemeral Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; transition: opacity 0.3s, top 0.3s;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden flex justify-center">
    
    <!-- Mobile Container (Max width for desktop usage, full for mobile) -->
    <div id="app-container" class="w-full max-w-md bg-white h-full relative shadow-xl flex flex-col overflow-hidden">
        
        <!-- ======================= -->
        <!-- UI: Toast Notifications -->
        <!-- ======================= -->
        <div id="toast-container" class="toast opacity-0 pointer-events-none hidden bg-gray-900 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium">
            <span id="toast-msg">Notification</span>
        </div>

        <!-- ======================= -->
        <!-- UI: Loading Overlay     -->
        <!-- ======================= -->
        <div id="loading-screen" class="absolute inset-0 bg-white z-50 flex flex-col items-center justify-center">
            <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin mb-4"></i>
            <p class="text-gray-500 font-medium">Loading Textde...</p>
        </div>

        <!-- ======================= -->
        <!-- UI: Login View          -->
        <!-- ======================= -->
        <div id="view-login" class="hidden absolute inset-0 bg-white z-40 flex flex-col items-center justify-center p-6">
            <div class="w-20 h-20 bg-blue-500 rounded-3xl flex items-center justify-center mb-6 shadow-lg shadow-blue-200">
                <i data-lucide="message-circle" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Textde</h1>
            <p class="text-gray-500 text-center mb-10">Ephemeral messaging. Chats disappear daily.</p>
            <button id="btn-login" class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center hover:bg-gray-50 transition active:scale-95">
                <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- ======================= -->
        <!-- UI: Username Setup      -->
        <!-- ======================= -->
        <div id="view-setup" class="hidden absolute inset-0 bg-white z-40 flex flex-col items-center justify-center p-6">
            <div class="w-full max-w-sm">
                <h2 class="text-2xl font-bold mb-2">Claim Username</h2>
                <p class="text-gray-500 mb-6 text-sm">Pick a unique username so friends can find you.</p>
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 font-bold">@</span>
                    <input type="text" id="input-username" placeholder="username" class="w-full pl-10 pr-4 py-3 bg-gray-100 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none lowercase font-medium">
                </div>
                <button id="btn-save-username" class="w-full bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-blue-200 hover:bg-blue-600 active:scale-95 transition">
                    Complete Setup
                </button>
            </div>
        </div>

        <!-- ======================= -->
        <!-- UI: Main App View       -->
        <!-- ======================= -->
        <div id="view-main" class="hidden flex-1 flex flex-col w-full h-full relative">
            
            <!-- Header -->
            <header class="flex justify-between items-center px-4 py-3 bg-white border-b border-gray-100 shrink-0">
                <div class="flex items-center gap-3">
                    <img id="my-profile-pic" src="" alt="Profile" class="w-9 h-9 rounded-full bg-gray-200 object-cover">
                    <div>
                        <h2 class="font-bold text-lg leading-tight" id="header-title">Chats</h2>
                        <p class="text-xs text-gray-500 leading-tight" id="my-username-display">@username</p>
                    </div>
                </div>
                <button id="btn-logout" class="p-2 text-gray-400 hover:text-red-500 transition rounded-full hover:bg-gray-50">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </header>

            <!-- Tab Content Area -->
            <main class="flex-1 overflow-y-auto hide-scrollbar relative bg-white">
                
                <!-- Tab: Chats -->
                <div id="tab-chats" class="w-full min-h-full p-2">
                    <!-- Chat items injected here -->
                    <div id="chats-list" class="flex flex-col gap-1"></div>
                    <div id="no-chats-msg" class="hidden flex flex-col items-center justify-center mt-20 text-gray-400">
                        <i data-lucide="message-square-dashed" class="w-12 h-12 mb-3 text-gray-300"></i>
                        <p>No active chats today.</p>
                        <p class="text-sm mt-1">Search users to start messaging!</p>
                    </div>
                </div>

                <!-- Tab: Search -->
                <div id="tab-search" class="hidden w-full min-h-full p-4">
                    <div class="relative mb-6">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Search exact username..." class="w-full pl-11 pr-4 py-3 bg-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    
                    <div id="search-results" class="flex flex-col gap-3">
                        <!-- Search result injected here -->
                    </div>
                </div>

                <!-- Tab: Friends -->
                <div id="tab-friends" class="hidden w-full min-h-full p-4">
                    <!-- Friend Requests Section -->
                    <div id="requests-section" class="mb-6 hidden">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-1">Friend Requests</h3>
                        <div id="requests-list" class="flex flex-col gap-2"></div>
                    </div>
                    
                    <!-- Friends List Section -->
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-1">Your Friends</h3>
                    <div id="friends-list" class="flex flex-col gap-2"></div>
                    <div id="no-friends-msg" class="hidden flex flex-col items-center justify-center mt-10 text-gray-400">
                        <i data-lucide="users" class="w-12 h-12 mb-3 text-gray-300"></i>
                        <p>No friends yet.</p>
                    </div>
                </div>

            </main>

            <!-- Bottom Navigation -->
            <nav class="flex justify-around items-center bg-white border-t border-gray-100 pb-safe pt-2 pb-2 shrink-0">
                <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center gap-1 w-20 text-blue-500 transition">
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Chats</span>
                </button>
                <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center gap-1 w-20 text-gray-400 hover:text-gray-900 transition">
                    <i data-lucide="search" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Search</span>
                </button>
                <button onclick="switchTab('friends')" id="nav-friends" class="flex flex-col items-center gap-1 w-20 text-gray-400 hover:text-gray-900 transition relative">
                    <i data-lucide="users" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Friends</span>
                    <span id="request-badge" class="hidden absolute top-0 right-5 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </nav>
        </div>

        <!-- ======================= -->
        <!-- UI: Active Chat Room    -->
        <!-- ======================= -->
        <div id="view-chat" class="hidden absolute inset-0 bg-white z-50 flex flex-col h-full fade-in">
            <!-- Chat Header -->
            <header class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-100 shrink-0 shadow-sm z-10">
                <button onclick="closeChat()" class="p-2 -ml-2 text-gray-500 hover:bg-gray-100 rounded-full transition active:scale-90">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <img id="active-chat-pic" src="" alt="Profile" class="w-10 h-10 rounded-full bg-gray-200 object-cover">
                <div class="flex-1">
                    <h2 id="active-chat-name" class="font-bold leading-tight">Name</h2>
                    <p id="active-chat-username" class="text-xs text-gray-500 leading-tight">@username</p>
                </div>
            </header>

            <!-- Chat Messages Area -->
            <main id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 bg-gray-50 hide-scrollbar pb-6">
                <!-- Messages injected here -->
            </main>

            <!-- Chat Input Area -->
            <footer class="bg-white px-4 py-3 border-t border-gray-100 shrink-0 flex items-end gap-2">
                <textarea id="chat-input" rows="1" placeholder="Type a message..." class="flex-1 bg-gray-100 rounded-2xl px-4 py-3 max-h-32 outline-none resize-none hide-scrollbar focus:ring-2 focus:ring-blue-500 transition"></textarea>
                <button id="btn-send-msg" class="w-12 h-12 shrink-0 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-md shadow-blue-200 hover:bg-blue-600 transition active:scale-90 disabled:opacity-50 disabled:active:scale-100">
                    <i data-lucide="send" class="w-5 h-5 ml-1"></i>
                </button>
            </footer>
        </div>

    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (User provided)
        const firebaseConfig = {
            apiKey: "AIzaSyCX5nofwFBV1J9zlTxcTKXW6hSiP92Z4FU",
            authDomain: "jndglbl.firebaseapp.com",
            projectId: "jndglbl",
            storageBucket: "jndglbl.firebasestorage.app",
            messagingSenderId: "842286185874",
            appId: "1:842286185874:web:aaa1ff9c66c98703d5154b",
            measurementId: "G-MTQMWZ3SVB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Canvas Strict Path Requirements (Isolates data neatly)
        const APP_ID = 'textde_v1';
        
        // App State
        let currentUser = null;
        let userProfile = null;
        let allProfiles = [];
        let allRelationships = [];
        let allConversations = [];
        
        let activeTab = 'chats';
        let activeChatUser = null;
        
        // Listeners for cleanup
        let unsubProfiles, unsubRelationships, unsubConversations;

        // UI Elements
        const elLoading = document.getElementById('loading-screen');
        const elLogin = document.getElementById('view-login');
        const elSetup = document.getElementById('view-setup');
        const elMain = document.getElementById('view-main');
        const elChat = document.getElementById('view-chat');

        // Initialization
        lucide.createIcons();
        setupAutoResizeTextarea();

        // ==========================================
        // Helper Functions
        // ==========================================
        
        function showToast(msg) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            toast.style.top = '40px';
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.style.top = '20px';
            }, 3000);
        }

        function switchView(viewId) {
            [elLoading, elLogin, elSetup, elMain, elChat].forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        window.switchTab = (tabName) => {
            activeTab = tabName;
            ['chats', 'search', 'friends'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-blue-500');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tabName}`).classList.add('text-blue-500');
            
            document.getElementById('header-title').innerText = tabName.charAt(0).toUpperCase() + tabName.slice(1);
            
            if(tabName === 'chats') renderChats();
            if(tabName === 'friends') renderFriends();
        };

        // Utility to get Midnight (12:00 AM) of Today
        function getStartOfToday() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d.getTime();
        }

        // Generate unique 1-on-1 ID
        function getPairId(uid1, uid2) {
            return [uid1, uid2].sort().join('_');
        }

        function setupAutoResizeTextarea() {
            const tx = document.getElementById('chat-input');
            tx.setAttribute('style', 'height:' + (tx.scrollHeight) + 'px;overflow-y:hidden;');
            tx.addEventListener("input", OnInput, false);
            function OnInput() {
                this.style.height = 0;
                this.style.height = (this.scrollHeight) + "px";
                if(this.value.trim() !== "") {
                    document.getElementById('btn-send-msg').disabled = false;
                } else {
                    document.getElementById('btn-send-msg').disabled = true;
                }
            }
        }

        // ==========================================
        // Authentication & Profile
        // ==========================================

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                // Check if user has a profile set up
                try {
                    const profileRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', user.uid);
                    const snap = await getDoc(profileRef);
                    
                    if (snap.exists() && snap.data().username) {
                        userProfile = snap.data();
                        document.getElementById('my-profile-pic').src = userProfile.photoURL || 'https://ui-avatars.com/api/?name=U&background=random';
                        document.getElementById('my-username-display').innerText = `@${userProfile.username}`;
                        loadAppData();
                        switchView('view-main');
                        window.switchTab('chats');
                    } else {
                        // Needs to setup username
                        switchView('view-setup');
                    }
                } catch (e) {
                    showToast("Error loading profile. Check connection.");
                    console.error(e);
                }
            } else {
                // Not logged in
                cleanupListeners();
                switchView('view-login');
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (err) {
                showToast("Login failed. Try again.");
                console.error(err);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        document.getElementById('btn-save-username').addEventListener('click', async () => {
            const input = document.getElementById('input-username');
            let username = input.value.trim().toLowerCase();
            
            if (username.length < 3) {
                showToast("Username must be at least 3 characters.");
                return;
            }
            if (!/^[a-z0-9_]+$/.test(username)) {
                showToast("Only letters, numbers, and underscores allowed.");
                return;
            }

            // Disable button
            document.getElementById('btn-save-username').disabled = true;
            document.getElementById('btn-save-username').innerText = "Checking...";

            try {
                // Simple collection query for check (Rule 2 compliant)
                const profilesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'profiles');
                let isUnique = true;
                
                // Note: Normally we'd use a unique username registry collection. For this scale, 
                // fetching all profiles to check is acceptable per Canvas constraints (No complex queries).
                const getProfilesSnap = onSnapshot(profilesRef, async (snap) => {
                    const exists = snap.docs.some(d => d.data().username === username && d.id !== currentUser.uid);
                    if (exists) {
                        showToast("Username already taken.");
                        document.getElementById('btn-save-username').disabled = false;
                        document.getElementById('btn-save-username').innerText = "Complete Setup";
                        getProfilesSnap(); // unsubscribe
                        return;
                    }

                    // Save Profile
                    const newProfile = {
                        uid: currentUser.uid,
                        email: currentUser.email,
                        displayName: currentUser.displayName,
                        photoURL: currentUser.photoURL,
                        username: username,
                        createdAt: Date.now()
                    };
                    
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', currentUser.uid), newProfile);
                    userProfile = newProfile;
                    getProfilesSnap(); // unsubscribe
                    
                    showToast("Profile created successfully!");
                    document.getElementById('my-profile-pic').src = userProfile.photoURL;
                    document.getElementById('my-username-display').innerText = `@${username}`;
                    
                    loadAppData();
                    switchView('view-main');
                    window.switchTab('chats');
                });

            } catch (err) {
                showToast("Error saving username.");
                document.getElementById('btn-save-username').disabled = false;
                document.getElementById('btn-save-username').innerText = "Complete Setup";
            }
        });

        // ==========================================
        // Data Loading & Real-time Listeners
        // ==========================================

        function cleanupListeners() {
            if(unsubProfiles) unsubProfiles();
            if(unsubRelationships) unsubRelationships();
            if(unsubConversations) unsubConversations();
        }

        function loadAppData() {
            if (!currentUser) return;
            cleanupListeners();

            // 1. Listen to all Profiles (Needed for Search and displaying names)
            const profilesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'profiles');
            unsubProfiles = onSnapshot(profilesRef, (snap) => {
                allProfiles = snap.docs.map(doc => doc.data());
                if(activeTab === 'search') renderSearch();
                if(activeTab === 'friends') renderFriends();
                if(activeTab === 'chats') renderChats();
            }, (err) => console.error("Profile listen error", err));

            // 2. Listen to Relationships (Friendships)
            const relRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'relationships');
            unsubRelationships = onSnapshot(relRef, (snap) => {
                // Filter relationships involving current user in memory (Rule 2)
                allRelationships = snap.docs.map(d => ({id: d.id, ...d.data()}))
                                        .filter(r => r.senderId === currentUser.uid || r.receiverId === currentUser.uid);
                
                // Update badge
                const pendingIn = allRelationships.filter(r => r.receiverId === currentUser.uid && r.status === 'pending');
                if (pendingIn.length > 0) document.getElementById('request-badge').classList.remove('hidden');
                else document.getElementById('request-badge').classList.add('hidden');

                if(activeTab === 'friends') renderFriends();
            }, (err) => console.error("Rel listen error", err));

            // 3. Listen to Conversations
            const convRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'conversations');
            unsubConversations = onSnapshot(convRef, (snap) => {
                // Filter conversations involving current user
                allConversations = snap.docs.map(d => ({id: d.id, ...d.data()}))
                                        .filter(c => c.participants && c.participants.includes(currentUser.uid));
                
                if(activeTab === 'chats') renderChats();
                if(activeChatUser) renderActiveChatMessages();
            }, (err) => console.error("Conv listen error", err));
        }

        // ==========================================
        // Search & Friends Features
        // ==========================================

        document.getElementById('search-input').addEventListener('input', renderSearch);

        function renderSearch() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            if (!query) return;

            const results = allProfiles.filter(p => p.username.includes(query) && p.uid !== currentUser.uid);

            if (results.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center mt-4 text-sm">No users found.</p>`;
                return;
            }

            results.forEach(user => {
                // Determine friendship status
                const pairId = getPairId(currentUser.uid, user.uid);
                const rel = allRelationships.find(r => r.id === pairId);
                let btnHTML = `<button onclick="sendFriendRequest('${user.uid}')" class="bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Add Friend</button>`;
                
                if (rel) {
                    if (rel.status === 'accepted') {
                        btnHTML = `<span class="text-xs text-green-500 font-bold bg-green-50 px-2 py-1 rounded-md">Friends</span>`;
                    } else if (rel.senderId === currentUser.uid) {
                        btnHTML = `<span class="text-xs text-gray-400 font-bold bg-gray-50 px-2 py-1 rounded-md">Requested</span>`;
                    } else {
                        btnHTML = `<button onclick="acceptFriendRequest('${pairId}')" class="bg-blue-500 text-white hover:bg-blue-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Accept Request</button>`;
                    }
                }

                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-3 bg-white border border-gray-100 rounded-2xl shadow-sm";
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${user.photoURL || 'https://ui-avatars.com/api/?name='+user.username}" class="w-10 h-10 rounded-full object-cover">
                        <div>
                            <p class="font-bold text-sm text-gray-900">${user.displayName || user.username}</p>
                            <p class="text-xs text-gray-500">@${user.username}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        ${btnHTML}
                        <button onclick="openChat('${user.uid}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-1.5 rounded-lg transition">
                            <i data-lucide="message-square" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        window.sendFriendRequest = async (targetUid) => {
            const pairId = getPairId(currentUser.uid, targetUid);
            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'relationships', pairId), {
                    senderId: currentUser.uid,
                    receiverId: targetUid,
                    status: 'pending',
                    timestamp: Date.now()
                });
                showToast("Friend request sent!");
            } catch (e) {
                showToast("Error sending request.");
                console.error(e);
            }
        };

        window.acceptFriendRequest = async (pairId) => {
            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'relationships', pairId), {
                    status: 'accepted',
                    updatedAt: Date.now()
                }, { merge: true });
                showToast("Request accepted!");
            } catch (e) {
                showToast("Error accepting request.");
                console.error(e);
            }
        };

        function renderFriends() {
            const reqContainer = document.getElementById('requests-list');
            const friendsContainer = document.getElementById('friends-list');
            const reqSection = document.getElementById('requests-section');
            const noFriends = document.getElementById('no-friends-msg');

            reqContainer.innerHTML = '';
            friendsContainer.innerHTML = '';

            const pendingIn = allRelationships.filter(r => r.receiverId === currentUser.uid && r.status === 'pending');
            const accepted = allRelationships.filter(r => r.status === 'accepted');

            if (pendingIn.length > 0) {
                reqSection.classList.remove('hidden');
                pendingIn.forEach(req => {
                    const friendProfile = allProfiles.find(p => p.uid === req.senderId);
                    if(!friendProfile) return;
                    reqContainer.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-blue-50 border border-blue-100 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <img src="${friendProfile.photoURL}" class="w-10 h-10 rounded-full object-cover">
                                <div>
                                    <p class="font-bold text-sm text-gray-900">${friendProfile.displayName || friendProfile.username}</p>
                                    <p class="text-xs text-gray-500">Wants to be friends</p>
                                </div>
                            </div>
                            <button onclick="acceptFriendRequest('${req.id}')" class="bg-blue-500 text-white px-4 py-1.5 rounded-xl text-sm font-bold shadow-sm shadow-blue-200">Accept</button>
                        </div>
                    `;
                });
            } else {
                reqSection.classList.add('hidden');
            }

            if (accepted.length > 0) {
                noFriends.classList.add('hidden');
                accepted.forEach(rel => {
                    const friendId = rel.senderId === currentUser.uid ? rel.receiverId : rel.senderId;
                    const friendProfile = allProfiles.find(p => p.uid === friendId);
                    if(!friendProfile) return;
                    
                    friendsContainer.innerHTML += `
                        <div onclick="openChat('${friendProfile.uid}')" class="flex items-center justify-between p-3 bg-white border border-gray-100 rounded-2xl shadow-sm active:scale-95 transition cursor-pointer">
                            <div class="flex items-center gap-3">
                                <img src="${friendProfile.photoURL}" class="w-10 h-10 rounded-full object-cover">
                                <div>
                                    <p class="font-bold text-sm text-gray-900">${friendProfile.displayName || friendProfile.username}</p>
                                    <p class="text-xs text-gray-500">@${friendProfile.username}</p>
                                </div>
                            </div>
                            <div class="p-2 text-gray-300">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </div>
                        </div>
                    `;
                });
            } else {
                noFriends.classList.remove('hidden');
            }
            lucide.createIcons();
        }

        // ==========================================
        // Ephemeral Messaging Features
        // ==========================================

        function filterTodayMessages(messages) {
            if (!messages) return [];
            const startOfToday = getStartOfToday();
            return messages.filter(m => m.timestamp >= startOfToday);
        }

        function renderChats() {
            const container = document.getElementById('chats-list');
            const noChats = document.getElementById('no-chats-msg');
            container.innerHTML = '';

            let hasActiveChats = false;

            // Sort conversations by latest update
            const sortedConvs = [...allConversations].sort((a,b) => (b.lastUpdated || 0) - (a.lastUpdated || 0));

            sortedConvs.forEach(conv => {
                // Ensure daily deletion enforcement logic locally before display
                const todayMessages = filterTodayMessages(conv.messages);
                
                if (todayMessages.length === 0) return; // Hide empty chats
                
                hasActiveChats = true;
                
                const otherUid = conv.participants.find(id => id !== currentUser.uid);
                const otherProfile = allProfiles.find(p => p.uid === otherUid);
                if(!otherProfile) return;

                const lastMsg = todayMessages[todayMessages.length - 1];
                const msgText = lastMsg.senderId === currentUser.uid ? `You: ${lastMsg.text}` : lastMsg.text;
                const timeStr = new Date(lastMsg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                container.innerHTML += `
                    <div onclick="openChat('${otherProfile.uid}')" class="flex items-center gap-3 p-3 bg-white hover:bg-gray-50 rounded-2xl cursor-pointer transition">
                        <img src="${otherProfile.photoURL}" class="w-12 h-12 rounded-full object-cover shrink-0">
                        <div class="flex-1 overflow-hidden">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <h4 class="font-bold text-gray-900 text-sm truncate">${otherProfile.displayName || otherProfile.username}</h4>
                                <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2">${timeStr}</span>
                            </div>
                            <p class="text-xs text-gray-500 truncate">${msgText}</p>
                        </div>
                    </div>
                `;
            });

            if(hasActiveChats) {
                noChats.classList.add('hidden');
            } else {
                noChats.classList.remove('hidden');
            }
        }

        window.openChat = (targetUid) => {
            activeChatUser = allProfiles.find(p => p.uid === targetUid);
            if (!activeChatUser) return;

            document.getElementById('active-chat-pic').src = activeChatUser.photoURL;
            document.getElementById('active-chat-name').innerText = activeChatUser.displayName || activeChatUser.username;
            document.getElementById('active-chat-username').innerText = `@${activeChatUser.username}`;

            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-chat').classList.remove('hidden');
            
            renderActiveChatMessages();
            
            // Scroll to bottom
            const msgArea = document.getElementById('chat-messages');
            setTimeout(() => { msgArea.scrollTop = msgArea.scrollHeight; }, 100);
        };

        window.closeChat = () => {
            activeChatUser = null;
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            renderChats(); // Re-render chat list to reflect latest state
        };

        function renderActiveChatMessages() {
            if (!activeChatUser) return;
            const pairId = getPairId(currentUser.uid, activeChatUser.uid);
            const conv = allConversations.find(c => c.id === pairId);
            
            const msgArea = document.getElementById('chat-messages');
            msgArea.innerHTML = '';

            // Notice badge about ephemeral chats
            msgArea.innerHTML = `
                <div class="text-center my-4">
                    <span class="bg-gray-200 text-gray-600 text-[10px] uppercase font-bold tracking-wider px-3 py-1 rounded-full">Chats disappear at 12:00 AM</span>
                </div>
            `;

            if (conv && conv.messages) {
                // Filter enforce ephemeral logic locally
                const validMsgs = filterTodayMessages(conv.messages);
                
                validMsgs.forEach(msg => {
                    const isMe = msg.senderId === currentUser.uid;
                    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    if (isMe) {
                        msgArea.innerHTML += `
                            <div class="flex flex-col items-end w-full mb-1">
                                <div class="bg-blue-500 text-white max-w-[80%] rounded-2xl rounded-tr-sm px-4 py-2 shadow-sm text-sm break-words">
                                    ${escapeHTML(msg.text)}
                                </div>
                                <span class="text-[10px] text-gray-400 mt-1 mr-1">${timeStr}</span>
                            </div>
                        `;
                    } else {
                        msgArea.innerHTML += `
                            <div class="flex flex-col items-start w-full mb-1">
                                <div class="bg-white border border-gray-100 text-gray-800 max-w-[80%] rounded-2xl rounded-tl-sm px-4 py-2 shadow-sm text-sm break-words">
                                    ${escapeHTML(msg.text)}
                                </div>
                                <span class="text-[10px] text-gray-400 mt-1 ml-1">${timeStr}</span>
                            </div>
                        `;
                    }
                });
            }
            
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        document.getElementById('btn-send-msg').addEventListener('click', async () => {
            if (!activeChatUser) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto'; // reset resize
            document.getElementById('btn-send-msg').disabled = true;

            const pairId = getPairId(currentUser.uid, activeChatUser.uid);
            const conv = allConversations.find(c => c.id === pairId);
            
            // Clean up old messages before saving (Enforcing daily deletion)
            let validMessages = [];
            if (conv && conv.messages) {
                validMessages = filterTodayMessages(conv.messages);
            }

            const newMessage = {
                senderId: currentUser.uid,
                text: text,
                timestamp: Date.now()
            };

            validMessages.push(newMessage);

            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'conversations', pairId), {
                    participants: [currentUser.uid, activeChatUser.uid],
                    messages: validMessages,
                    lastUpdated: Date.now()
                }, { merge: true });
                
                // Keep scroll down
                const msgArea = document.getElementById('chat-messages');
                setTimeout(() => { msgArea.scrollTop = msgArea.scrollHeight; }, 100);

            } catch (e) {
                showToast("Failed to send message.");
                console.error(e);
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

    </script>
</body>
</html>
