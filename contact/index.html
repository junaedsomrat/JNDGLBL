
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correspondence</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Lato"', 'sans-serif'],
                    },
                    colors: { paper: '#f5f5f0', ink: '#0a0a0a' }
                }
            }
        }
    </script>

    <script src="/contact/style.js"></script>
</head>
<body class="selection:bg-white selection:text-black font-serif antialiased">

<div id="loader-wrapper">
    <svg width="400" height="200" viewBox="0 0 400 200" class="overflow-visible">
        <g id="speed-lines">
            <line x1="450" y1="50" x2="600" y2="50" class="speed-line" />
            <line x1="500" y1="80" x2="700" y2="80" class="speed-line" />
            <line x1="420" y1="120" x2="550" y2="120" class="speed-line" />
        </g>
        <g id="hero-mail" transform="translate(160, 80)">
            <g id="mail-tilt" transform="rotate(-5)">
                <path d="M0,0 L80,0 L80,50 L0,50 Z" class="mail-body" />
                <path d="M0,0 L40,30 L80,0" fill="none" stroke="#fff" stroke-width="2" />
            </g>
        </g>
    </svg>
    <div class="absolute bottom-10 w-full text-center">
        <div id="loading-text" class="text-white/40 text-xs font-sans tracking-[0.5em] uppercase italic">Incoming</div>
    </div>
</div>

<div id="toast" class="fixed top-8 right-8 z-[110] translate-x-32 opacity-0 transition-all duration-700">
    <div class="bg-white/10 backdrop-blur-md border border-white/20 px-6 py-4 rounded-sm flex items-center gap-4 shadow-2xl">
        <div id="toast-icon" class="text-white"></div>
        <div>
            <h4 id="toast-title" class="font-serif text-lg text-white">Status</h4>
            <p id="toast-msg" class="font-sans text-xs text-gray-400 uppercase tracking-wider">Message Sent</p>
        </div>
    </div>
</div>

<main class="min-h-screen w-full flex items-center justify-center p-6 relative opacity-0 -translate-x-full" id="main-content">
    <div class="fixed top-0 left-1/4 w-[1px] h-full bg-white/5 pointer-events-none"></div>
    <div class="fixed top-0 right-1/4 w-[1px] h-full bg-white/5 pointer-events-none"></div>
    <div class="fixed top-1/2 left-0 w-full h-[1px] bg-white/5 pointer-events-none"></div>

    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-12 gap-12 items-center relative z-10">
        <div class="md:col-span-5 text-center md:text-left">
            <h2 class="text-xs font-sans text-gray-500 uppercase tracking-[0.2em] mb-4">Est. 2025</h2>
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-serif italic mb-6 leading-[0.9] shimmer-text">Write<br>to me.</h1>
            <p class="text-gray-400 font-serif text-xl leading-relaxed">A direct line to my digital archive.</p>
            <div class="mt-12 hidden md:block">
                <div class="w-16 h-16 border border-white/20 rounded-full flex items-center justify-center animate-float">
                    <i data-lucide="feather" class="w-6 h-6 text-white/50"></i>
                </div>
            </div>
        </div>

        <div class="md:col-span-7 w-full max-w-md mx-auto md:ml-auto">
            <form id="contactForm" class="bg-[#0a0a0a] border border-white/10 p-8 md:p-12 shadow-2xl relative">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                
                <div class="space-y-2">
                    <div class="input-group">
                        <input type="text" name="name" id="name" required class="w-full bg-transparent py-3 text-white font-serif text-2xl placeholder-white/50 focus:outline-none" placeholder="Your Name">
                        <div class="input-line"></div>
                    </div>
                    <div class="input-group">
                        <input type="text" name="_subject" id="subject" required class="w-full bg-transparent py-3 text-white font-serif text-2xl placeholder-white/50 focus:outline-none" placeholder="Subject">
                        <div class="input-line"></div>
                    </div>
                    <div class="input-group">
                        <textarea name="message" id="message" rows="3" required class="w-full bg-transparent py-3 text-white font-serif text-2xl placeholder-white/50 focus:outline-none resize-none" placeholder="Message..."></textarea>
                        <div class="input-line"></div>
                    </div>
                </div>

                <div class="mt-10">
                    <button type="submit" id="submitBtn" class="w-full relative overflow-hidden bg-white text-black py-4 px-6 font-bold uppercase text-xs tracking-[0.2em] transition-all hover:bg-[#e0e0e0]">
                        <span id="btnText" class="flex justify-between items-center">Send Correspondence <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
                        <div id="btnLoader" class="absolute inset-0 bg-white flex items-center justify-center translate-y-full transition-transform">
                            <div class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                        </div>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/contact/script.js"></script>
</body>
</html>
